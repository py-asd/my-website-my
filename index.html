<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاستعلام الذكي الدائم</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .welcome-card {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 85%;
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <!-- صندوق الاستعلام الذكي -->
        <div class="search-container" style="margin-top: 20px; text-align: center;">
            <input type="number" id="searchNum" placeholder="أدخل الرقم التسلسلي للبحث..." style="padding: 10px; width: 250px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; text-align: center; color: black;">
            <button onclick="searchTransaction()" style="padding: 10px 20px; background-color: #0070f3; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-left: 10px; font-weight: bold;">استعلام</button>
        </div>

        <!-- مكان عرض النتيجة للمستخدم -->
        <div id="resultBox" style="margin-top: 25px; padding: 20px; border-radius: 8px; background: rgba(255,255,255,0.15); display: none; text-align: right; direction: rtl; border: 1px solid rgba(255,255,255,0.2);">
        </div>

        <script>
        async function searchTransaction() {
            const numInput = document.getElementById('searchNum').value;
            const resultBox = document.getElementById('resultBox');
            
            if(!numInput) {
                alert('الرجاء إدخال الرقم التسلسلي أولاً!');
                return;
            }
            
            resultBox.style.display = 'block';
            resultBox.innerHTML = '<p style="text-align:center; color: white;">🔍 جاري فحص قاعدة البيانات السحابية...</p>';
            
            const SUPABASE_URL = "https://supabase.co";
            const SUPABASE_KEY = "sb_publishable_1bI_L21S-jOGYCu0u13S1A_CUZn9_v_xIidXfCia0T46v_oE4Hw9R2b1pG5jZ3mN7uC_0"; 

            try {
                // استعلام مباشر ونقي للاتصال بالجدول الجديد transactions
                const response = await fetch(`${SUPABASE_URL}/rest/v1/transactions?num=eq.${parseInt(numInput, 10)}`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                const data = await response.json();
                
                if(data && data.length > 0) {
                    const item = data[0]; // قراءة أول معاملة مطابقة بنجاح
                    
                    // توليد محتوى العرض وترجمة مسميات الأعمدة المرفوعة تلقائياً إلى لغة عربية منسقة وجذابة
                    let htmlContent = `<h3 style="text-align:center; color:#00ffcc; margin-bottom:15px;">📊 تفاصيل المعاملة المكتشفة</h3>`;
                    
                    for (const key in item) {
                        if (item.hasOwnProperty(key)) {
                            let friendlyName = key;
                            // هنا نقوم بتبديل المسميات التقنية إلى مسميات عربية جميلة للمستخدم
                            if (key === 'num') friendlyName = 'الرقم التسلسلي';
                            if (key === 'NO_DEPT') friendlyName = 'رقم/رمز القسم';
                            if (key === 'DAT_DEPT') friendlyName = 'تاريخ القسم';
                            
                            htmlContent += `<p style="margin: 8px 0; color: white; font-size: 18px;"><strong>📌 ${friendlyName}:</strong> ${item[key] !== null ? item[key] : 'بلا'}</p>`;
                        }
                    }
                    
                    resultBox.innerHTML = htmlContent;
                } else {
                    resultBox.innerHTML = '<p style="text-align:center; color:#ff4d4d; font-weight:bold; font-size: 16px;">❌ عذراً، هذا الرقم غير مسجل في النظام السحابي!</p>';
                }
            } catch (error) {
                console.error(error);
                resultBox.innerHTML = '<p style="text-align:center; color:#ff4d4d; font-weight:bold; font-size: 16px;">⚠️ حدث خطأ في الشبكة، يرجى الاستعلام باستخدام باقة بيانات الهاتف (4G/5G)!</p>';
            }
        }
        </script>
    </div>
</body>
</html>
