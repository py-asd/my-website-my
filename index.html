<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاستعلام الذكي المستقل</title>
    <!-- استدعاء أيقونات FontAwesome لشكل زر التحميل الاحترافي -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .welcome-card {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 85%;
        }
        .pdf-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            padding: 12px 25px;
            background-color: #ff4d4d;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255, 77, 77, 0.4);
            transition: all 0.3s ease;
        }
        .pdf-btn:hover {
            background-color: #e03e3e;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <!-- صندوق الاستعلام الذكي -->
        <div class="search-container" style="margin-top: 20px; text-align: center;">
            <input type="number" id="searchNum" placeholder="أدخل الرقم التسلسلي للبحث..." style="padding: 10px; width: 250px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; text-align: center; color: black;">
            <button onclick="searchTransaction()" style="padding: 10px 20px; background-color: #0070f3; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-left: 10px; font-weight: bold;">استعلام</button>
        </div>

        <!-- مكان عرض النتيجة للمستخدم -->
        <div id="resultBox" style="margin-top: 25px; padding: 20px; border-radius: 8px; background: rgba(255,255,255,0.15); display: none; text-align: right; direction: rtl; border: 1px solid rgba(255,255,255,0.2);">
        </div>

        <script>
        function parseCSV(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            if (lines.length === 0) return { headers: [], data: [] };

            let delimiter = ',';
            const firstLine = lines[0];
            if (firstLine.includes(';')) delimiter = ';';
            else if (firstLine.includes('\t')) delimiter = '\t';

            const headers = firstLine.split(delimiter).map(h => h.trim().replace(/^"|"\$/g, ''));
            const result = [];

            for (let i = 1; i < lines.length; i++) {
                const currentline = lines[i].split(delimiter).map(v => v.trim().replace(/^"|"\$/g, ''));
                const obj = {};
                for (let j = 0; j < headers.length; j++) {
                    obj[headers[j]] = currentline[j] || '';
                }
                result.push(obj);
            }
            return { headers, data: result };
        }

        async function searchTransaction() {
            const numInput = document.getElementById('searchNum').value.trim();
            const resultBox = document.getElementById('resultBox');
            
            if(!numInput) {
                alert('الرجاء إدخال الرقم التسلسلي أولاً!');
                return;
            }
            
            resultBox.style.display = 'block';
            resultBox.innerHTML = '<p style="text-align:center; color: white;">🔍 جاري البحث الفوري في ملف البيانات المحلي...</p>';
            
            try {
                const response = await fetch('main.csv');
                if (!response.ok) throw new Error('فشل في قراءة ملف البيانات');
                
                const arrayBuffer = await response.arrayBuffer();
                const decoder = new TextDecoder('windows-1256'); 
                const csvText = decoder.decode(arrayBuffer);
                
                const parsed = parseCSV(csvText);
                const firstColumnName = parsed.headers[0]; 
                
                const foundItem = parsed.data.find(item => {
                    const itemValue = String(item[firstColumnName]).trim();
                    return itemValue === numInput || itemValue.replace(/[\u200B-\u200D\uFEFF]/g, '') === numInput;
                });
                
                if(foundItem) {
                    let htmlContent = `<h3 style="text-align:center; color:#00ffcc; margin-bottom:15px;">📊 تفاصيل المعاملة المكتشفة</h3>`;
                    
                    for (const key in foundItem) {
                        if (foundItem.hasOwnProperty(key)) {
                            let displayName = key;
                            if (key === firstColumnName) displayName = 'الرقم التسلسلي';
                            if (key === 'NO_DEPT') displayName = 'رقم/رمز القسم';
                            if (key === 'DAT_DEPT') displayName = 'تاريخ القسم';
                            
                            htmlContent += `<p style="margin: 8px 0; color: white; font-size: 18px;"><strong>📌 ${displayName}:</strong> ${foundItem[key] || 'بلا'}</p>`;
                        }
                    }
                    
                    // إضافة أيقونة وزر سحب وتحميل كتاب الـ PDF المربوط بالرقم بشكل جمالي
                    const pdfUrl = `books/${numInput}.pdf`;
                    htmlContent += `
                        <div style="text-align:center; margin-top:20px;">
                            <a href="${pdfUrl}" target="_blank" class="pdf-btn">
                                <i class="fa-solid fa-file-pdf style="font-size:20px;"></i>
                                تحميل / عرض الكتاب الصادر PDF
                            </a>
                        </div>
                    `;
                    
                    resultBox.innerHTML = htmlContent;
                } else {
                    resultBox.innerHTML = '<p style="text-align:center; color:#ff4d4d; font-weight:bold; font-size: 16px;">❌ عذراً، هذا الرقم التسلسلي غير مسجل في ملف البيانات!</p>';
                }
            } catch (error) {
                console.error(error);
                resultBox.innerHTML = '<p style="text-align:center; color:#ff4d4d; font-weight:bold; font-size: 16px;">⚠️ حدث خطأ أثناء قراءة البيانات المحلية المرفقة!</p>';
            }
        }
        </script>
    </div>
</body>
</html>
