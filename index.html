<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي العالمي الدائم</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .welcome-card {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 85%;
        }
        h1 { font-size: 2.5rem; margin-bottom: 15px; color: #00f2fe; }
        p { font-size: 1.2rem; opacity: 0.9; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="welcome-card">
        <!-- صندوق الاستعلام الذكي عن المعاملات -->
        <div class="search-container" style="margin-top: 20px; text-align: center;">
            <input type="number" id="searchNum" placeholder="أدخل الرقم التسلسلي (num)..." style="padding: 10px; width: 250px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; text-align: center; color: black;">
            <button onclick="searchTransaction()" style="padding: 10px 20px; background-color: #0070f3; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-left: 10px; font-weight: bold;">استعلام</button>
        </div>

        <!-- مكان عرض النتيجة للمستخدم -->
        <div id="resultBox" style="margin-top: 25px; padding: 20px; border-radius: 8px; background: rgba(255,255,255,0.15); display: none; text-align: right; direction: rtl; border: 1px solid rgba(255,255,255,0.2);">
            <div id="resContent"></div>
        </div>

        <!-- مكتبة الربط والذكاء البرمجي مع سيرفر Supabase -->
        <script>
        async function searchTransaction() {
            const numInput = document.getElementById('searchNum').value;
            const resultBox = document.getElementById('resultBox');
            
            if(!numInput) {
                alert('الرجاء إدخال الرقم التسلسلي أولاً!');
                return;
            }
            
            resultBox.style.display = 'block';
            resultBox.innerHTML = '<p style="text-align:center; color: white;">🔍 جاري البحث في السيرفر السحابي...</p>';
            
            // تم تصحيح رابط السيرفر هنا لربطه بقاعدة بياناتك مباشرة
            const SUPABASE_URL = "https://hggwtmsqlljqdgfqjufj.supabase.co";
            const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnZ3dtc3FsbGpxamRnZnFqdWZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgzMTU0NTcsImV4cCI6MjA3Mzg5MTQ1N30.gK2qS3fV8b_nZ4tF5T6R7X8_P_uB_f9mN3z2L4x5w_0"; 

            try {
                // استدعاء البيانات بناءً على العمود num المتواجد في الجدول الخاص بك
                const response = await fetch(`${SUPABASE_URL}/rest/v1/main?num=eq.${numInput}`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Range': '0-0'
                    }
                });
                
                const data = await response.json();
                
                if(data && data.length > 0) {
                    const item = data[0]; 
                    resultBox.innerHTML = `
                        <h3 style="text-align:center; color:#00ffcc; margin-bottom:15px; font-family:sans-serif;">📊 تفاصيل المعاملة المكتشفة</h3>
                        <p style="margin: 8px 0; color: white; font-size: 18px;"><strong>📄 رقم الكتاب الوارد:</strong> ${item['رقم الكتاب الوارد'] || 'بلا'}</p>
                        <p style="margin: 8px 0; color: white; font-size: 18px;"><strong>🔢 رقم المعاملة:</strong> ${item['رقم'] || 'بلا'}</p>
                        <p style="margin: 8px 0; color: white; font-size: 18px;"><strong>📅 التاريخ:</strong> ${item['التاريخ'] || 'بلا'}</p>
                        <p style="margin: 8px 0; color: white; font-size: 18px;"><strong>📝 الموضوع:</strong> ${item['الموضوع'] || 'بلا'}</p>
                        <p style="margin: 8px 0; color: white; font-size: 18px;"><strong>🏢 الجهة المرسلة:</strong> ${item['الجهة المرسله للكتاب'] || 'بلا'}</p>
                        <p style="margin: 8px 0; color: white; font-size: 18px;"><strong>📌 الملاحظات:</strong> ${item['الملاحظات'] || 'بلا'}</p>
                    `;
                } else {
                    resultBox.innerHTML = '<p style="text-align:center; color:#ff4d4d; font-weight:bold; font-size: 16px;">❌ عذراً، هذا الرقم التسلسلي غير مسجل في النظام!</p>';
                }
            } catch (error) {
                resultBox.innerHTML = '<p style="text-align:center; color:#ff4d4d; font-weight:bold; font-size: 16px;">⚠️ حدث خطأ أثناء جلب البيانات من السيرفر!</p>';
            }
        }
        </script>
    </div>
</body>
</html>
