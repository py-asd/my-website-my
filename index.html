<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاستعلام الذكي المستقل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .welcome-card {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 85%;
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <!-- صندوق الاستعلام الذكي المحلي -->
        <div class="search-container" style="margin-top: 20px; text-align: center;">
            <input type="number" id="searchNum" placeholder="أدخل الرقمي التسلسلي للبحث..." style="padding: 10px; width: 250px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; text-align: center; color: black;">
            <button onclick="searchTransaction()" style="padding: 10px 20px; background-color: #0070f3; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-left: 10px; font-weight: bold;">استعلام</button>
        </div>

        <!-- مكان عرض النتيجة للمستخدم -->
        <div id="resultBox" style="margin-top: 25px; padding: 20px; border-radius: 8px; background: rgba(255,255,255,0.15); display: none; text-align: right; direction: rtl; border: 1px solid rgba(255,255,255,0.2);">
        </div>

        <script>
        // دالة ذكية تقوم بقراءة ملف CSV وتحويله إلى أسطر برمجية مفهومة
        function parseCSV(text) {
            const lines = text.split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"\$/g, ''));
            const result = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const currentline = lines[i].split(',').map(v => v.trim().replace(/^"|"\$/g, ''));
                const obj = {};
                for (let j = 0; j < headers.length; j++) {
                    obj[headers[j]] = currentline[j];
                }
                result.push(obj);
            }
            return result;
        }

        async function searchTransaction() {
            const numInput = document.getElementById('searchNum').value.trim();
            const resultBox = document.getElementById('resultBox');
            
            if(!numInput) {
                alert('الرجاء إدخال الرقم التسلسلي أولاً!');
                return;
            }
            
            resultBox.style.display = 'block';
            resultBox.innerHTML = '<p style="text-align:center; color: white;">🔍 جاري البحث الفوري في ملف البيانات المحلي...</p>';
            
            try {
                // جلب ملف main.csv المتواجد بجانب الموقع مباشرة دون سيرفرات خارجية
                const response = await fetch('main.csv');
                if (!response.ok) throw new Error('فشل في قراءة ملف البيانات المرفق');
                
                const csvText = await response.text();
                const transactions = parseCSV(csvText);
                
                // البحث عن الرقم المطابق داخل الملف
                const foundItem = transactions.find(item => String(item['num']) === String(numInput));
                
                if(foundItem) {
                    let htmlContent = `<h3 style="text-align:center; color:#00ffcc; margin-bottom:15px;">📊 تفاصيل المعاملة المكتشفة</h3>`;
                    
                    // استخراج وعرض البيانات تلقائياً بأسمائها العربية أو الإنجليزية المخزنة بالملف
                    for (const key in foundItem) {
                        if (foundItem.hasOwnProperty(key) && key !== 'num') {
                            let displayName = key;
                            if (key === 'NO_DEPT') displayName = 'رقم/رمز القسم';
                            if (key === 'DAT_DEPT') displayName = 'تاريخ القسم';
                            
                            htmlContent += `<p style="margin: 8px 0; color: white; font-size: 18px;"><strong>📌 ${displayName}:</strong> ${foundItem[key] || 'بلا'}</p>`;
                        }
                    }
                    resultBox.innerHTML = htmlContent;
                } else {
                    resultBox.innerHTML = '<p style="text-align:center; color:#ff4d4d; font-weight:bold; font-size: 16px;">❌ عذراً، هذا الرقم التسلسلي غير مسجل في ملف البيانات!</p>';
                }
            } catch (error) {
                console.error(error);
                resultBox.innerHTML = '<p style="text-align:center; color:#ff4d4d; font-weight:bold; font-size: 16px;">⚠️ حدث خطأ أثناء قراءة البيانات المحلية المرفقة!</p>';
            }
        }
        </script>
    </div>
</body>
</html>
