<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي العالمي الدائم</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .welcome-card {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 85%;
        }
        h1 { font-size: 2.5rem; margin-bottom: 15px; color: #00f2fe; }
        p { font-size: 1.2rem; opacity: 0.9; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="welcome-card">
<h1>مرحبا بك في موقعي الجديد رويده حبيبتي</h1>
    #    <p>هذه الواجهة مستضافة الآن على سيرفرات إنترنت عالمية سحابية. يمكنك فتح هذا الرابط من موبايلك في أي وقت، حتى لو كان اللابتوب الخاص بي مغلقاً تماماً.</p>
    </div>
</body>
</html>
